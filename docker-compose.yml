services:
  # REServer (HTTP API). Uses an embedded SQLite database stored at
  # /data/re-server.db. The data directory is bind-mounted from ./data so the
  # loader and the server share the same file.
  server:
    build: ./REServer
    ports:
      - "7070:7070"
    environment:
      SQLITE_PATH: /data/re-server.db
    volumes:
      - ./data:/data

  # One-shot CSV → SQLite loader. Run with `docker compose run --rm loader`.
  # Not part of `docker compose up` so the server isn't blocked on a multi-minute load.
  loader:
    build: ./REDataLoader
    profiles: ["load"]
    environment:
      SQLITE_PATH: /data/re-server.db
      RE_CSV_PATH: /data/nsw_property_data.csv
    volumes:
      - ./data:/data
